task: T-319
owner: Joseph
allocation:
  existing_job_id: 447101
  node: ilab1
  gpu: RTX A4500
  policy: reuse_only
  forbidden_job_ids: [435775, 447008]
  forbidden_owner: ap2772
# sbatch creates a NEW job ID; it cannot attach to allocation 447101.
# The exact runnable spec therefore uses an srun step, not a new sbatch.
launch:
  cwd: ~/hearing-remote
  command: srun --jobid=447101 --overlap --nodelist=ilab1 bash gpu_jobs/T-319/run_ilab.sh
  sbatch: null
  timeout_budget: '02:00:00 (existing allocation must have >=2h remaining)'
  expected_runtime: '5-20 minutes estimated, not measured; stop at 2 hours'
data:
  path: ~/hearing-remote/gpu_jobs/T-319/data/team_slices.npz
  augmented_alternative: 'Set DATA to T-310 flat NPZ with the README metadata contract'
  provenance: 'T-291/T-310 artifacts not available in preparation checkout; validate schema before GPU launch'
  require: [x, speaker, duration, source_id, split]
training:
  frozen_encoder: true
  projection: [192, 64, 32]
  losses: [angular_prototypical, subcenter_arcface, cross_entropy]
  seeds: [0, 1, 2]
  steps_per_loss: 2000
  crops_per_speaker: 4
  subcenters_per_speaker: 3
outputs:
  directory: ~/hearing-remote/eval/results/T-319/seed{0,1,2}
  checkpoints: [ap.pt, subcenter.pt, ce.pt]
  metrics: metrics.json
  calibration: '{raw,ap,subcenter,ce}_calibration.json'
evaluation:
  objectives: [pair_margin, margin_p05, flip_rate]
  calibration: [brier, log_loss, fixed_0_7_error, calibrated_error]
  excluded: [EER]
