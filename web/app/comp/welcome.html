<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<link rel="preload" href="../fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="comp.css">
<title>Comp: Welcome</title>
</head>
<body>
<!-- Comp: mic off, so the field is flat and labelled idle. --hold .35 shows the press-and-hold ring a third of the way in. -->
<main class="frame is-idle">
  <div class="field field--idle" aria-hidden="true"></div>
  <span class="field-label" aria-hidden="true">idle, mic off</span>
  <header class="top">
    <span class="wordmark">Selective Hearing</span>
  </header>
  <div></div>
  <section class="welcome-main">
    <h1 class="hero">Turn down the world without disconnecting from it.</h1>
    <div class="welcome-row">
      <button class="hold" style="--hold:.35">Hold to start<small>opens the mic</small></button>
      <div class="facts">
        <span>Pick one voice. The room goes quiet around it.</span>
        <span><strong>About 1.5 s behind</strong>, like live captions.</span>
        <span class="install">On a phone: Share, then Add to Home Screen.</span>
      </div>
    </div>
  </section>
  <span class="comp-tag">Comp, sample values</span>
</main>
</body>
</html>
